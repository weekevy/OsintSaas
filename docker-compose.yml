services:
  mariadb:
    image: mariadb:10.11
    container_name: osint_mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./server/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - osint_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: osint_phpmyadmin
    restart: always
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
    ports:
      - "8080:80"
    depends_on:
      - mariadb
    networks:
      - osint_network

  job-recruitment:
    build: ./docker/job-recruitment
    container_name: job-recruitment-tool
    restart: unless-stopped
    volumes:
      - ./docker/job-recruitment/data:/app/data
      - ./docker/job-recruitment/output:/app/output
      - ./docker/job-recruitment/logs:/app/logs
      - ./docker/job-recruitment/config:/app/config
      - ./docker/job-recruitment/tools:/app/tools
    environment:
      # - SHODAN_API_KEY=${SHODAN_API_KEY}
      # - CENSYS_API_ID=${CENSYS_API_ID}
      # - CENSYS_API_SECRET=${CENSYS_API_SECRET}
      # - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY}
      # - HUNTER_API_KEY=${HUNTER_API_KEY}
      # - CLEARBIT_API_KEY=${CLEARBIT_API_KEY}
      - MARIADB_HOST=mariadb
      - MARIADB_DATABASE=${MYSQL_DATABASE}
      - MARIADB_USER=${MYSQL_USER}
      - MARIADB_PASSWORD=${MYSQL_PASSWORD}
    ports:
      - "8000:8000"
    depends_on:
      - mariadb
    networks:
      - osint_network
    stdin_open: true
    tty: true
    command: >
      sh -c "
      if [ -f /app/tools/api_server.py ]; then
        pip install fastapi uvicorn pydantic python-multipart &&
        uvicorn tools.api_server:app --host 0.0.0.0 --port 8000 --reload &
      fi &&
      tail -f /dev/null
      "

  # LinkedIn Investigation Tool
  linkedin-investigation:
    build: ./docker/linkedin-investigation
    container_name: linkedin-investigation-tool
    restart: unless-stopped
    volumes:
      - ./docker/linkedin-investigation/data:/app/data
      - ./docker/linkedin-investigation/output:/app/output
      - ./docker/linkedin-investigation/logs:/app/logs
      - ./docker/linkedin-investigation/config:/app/config
      - ./docker/linkedin-investigation/tools:/app/tools
    environment:
      # - LINKEDIN_EMAIL=${LINKEDIN_EMAIL}
      # - LINKEDIN_PASSWORD=${LINKEDIN_PASSWORD}
      - MARIADB_HOST=mariadb
      - MARIADB_DATABASE=${MYSQL_DATABASE}
      - MARIADB_USER=${MYSQL_USER}
      - MARIADB_PASSWORD=${MYSQL_PASSWORD}
    ports:
      - "8001:8001"
    depends_on:
      - mariadb
    networks:
      - osint_network
    stdin_open: true
    tty: true

