version: '3.8'

services:
  linkedin-investigation:
    restart:
    build: .
    container_name: linkedin-investigation
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./logs:/app/logs
      - ./config:/app/config
      - ./tools:/app/tools
    ports:
      - "8000:8000"  # FastAPI
      - "5000:5000"  # Flask
    networks:
      - osint-network
    stdin_open: true
    tty: true

networks:
  osint-network:
    driver: bridge
