version: '3.8'

services:
  job-recruitment:
    build: .
    container_name: job-recruitment-scanner
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - scanner-network

networks:
  scanner-network:
    driver: bridge